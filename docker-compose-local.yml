version: "3.8"

services:
  db:
    build:
      # Root context, matching the CI build: db/Dockerfile copies db/init.sql,
      # so a context of db/ alone cannot see it. Building what CI publishes is
      # the point -- otherwise the local image and the released one differ.
      context: .
      dockerfile: db/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # Mounted at /var/lib/postgresql, not .../data: Postgres 18 keeps PGDATA
      # in a version subdirectory and refuses to start when it finds a volume
      # at the old path.
      - db_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
      - /var/run/postgresql
    command:
      [
        "postgres",
        "-c",
        "log_statement=all",
        "-c",
        "log_destination=stderr",
        "-c",
        "shared_preload_libraries=pg_cron",
        "-c",
        "cron.database_name=${POSTGRES_DB}",
      ]

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # The password travels in PGPASSWORD, not in the URL. In a URL `%`, `@`,
      # `/`, `:` and `#` are syntax, so a generated password containing one of
      # them made the DSN unparseable and the app restart-looped. pgx takes user
      # and password from PGUSER/PGPASSWORD when the DSN leaves them out.
      DB_DSN: postgres://db:5432/${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - db
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

volumes:
  db_data:
